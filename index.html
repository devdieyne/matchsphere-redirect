<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Rejoignez un match sur Play Match"/>
  <title>Rejoindre un match - Play Match</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem;
    }
    .container { text-align: center; max-width: 500px; width: 100%; }
    .logo { font-size: 4rem; margin-bottom: 1rem; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
    h1 { font-size: 2rem; margin-bottom: 1rem; font-weight: 600; }
    p { font-size: 1.1rem; margin-bottom: 2rem; opacity: 0.9; line-height: 1.5; }
    .loader { margin: 2rem auto; width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .button { display: inline-block; padding: 1rem 2rem; background: white; color: #667eea; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; margin: 0.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .button:active { transform: translateY(0); }
    .button-secondary { background: transparent; border: 2px solid white; color: white; }
    .button-secondary:hover { background: rgba(255,255,255,0.1); }
    .info-text { font-size: 0.9rem; margin-top: 3rem; opacity: 0.8; }
    .error { background: rgba(255,0,0,0.2); border: 2px solid rgba(255,0,0,0.5); padding: 1rem; border-radius: 8px; margin-bottom: 2rem; }
    @media (max-width:600px) {
      h1 { font-size: 1.5rem; } p { font-size: 1rem; } .logo { font-size: 3rem; } .button { display: block; margin: 0.5rem auto; }
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <div class="logo">🏀</div>
    <h1>Redirection en cours...</h1>
    <div class="loader" aria-hidden="true"></div>
    <p>Ouverture de l'application Play Match</p>
    <p class="info-text">Si l'application ne s'ouvre pas automatiquement :</p>
    <a href="#" id="deepLinkBtn" class="button">Ouvrir l'application</a>
  </div>

  <script>
    (function () {
      // Récupère id depuis query string
      var urlParams = new URLSearchParams(window.location.search);
      var matchId = urlParams.get('id');

      var container = document.getElementById('mainContainer');

      if (!matchId) {
        container.innerHTML = ''
          + '<div class="logo">❌</div>'
          + '<h1>Erreur</h1>'
          + '<div class="error"><p>Lien invalide : ID de match manquant</p></div>'
          + '<p>Veuillez vérifier le lien que vous avez reçu.</p>';
        return;
      }

      // Construire le deep link sans template literals pour éviter des erreurs de syntaxe
      var deepLink = 'play-match://match/' + matchId;
      var deepLinkBtn = document.getElementById('deepLinkBtn');
      if (deepLinkBtn) {
        deepLinkBtn.href = deepLink;
        // Ouvre dans la même fenêtre ; si tu préfères target=_blank tu peux l'ajouter.
      }

      // Tente d'ouvrir l'application
      setTimeout(function () {
        window.location.href = deepLink;
      }, 500);

      // Après délai, si la page est toujours visible, on affiche le store
      setTimeout(function () {
        // document.hidden fonctionne dans la plupart des navigateurs modernes
        var appOpened = document.hidden || !document.hasFocus();
        if (!appOpened) {
          container.innerHTML = ''
            + '<div class="logo">📱</div>'
            + '<h1>Application non installée</h1>'
            + '<p>Téléchargez Play Match pour rejoindre ce match et découvrir d\'autres matchs près de chez vous.</p>'
            + '<a href="https://apps.apple.com/app/play-match" class="button" rel="noopener noreferrer" target="_blank">📱 Télécharger sur l\'App Store</a>'
            + '<a href="https://play.google.com/store/apps/details?id=com.playmatch" class="button" rel="noopener noreferrer" target="_blank">🤖 Télécharger sur Google Play</a>'
            + '<p class="info-text">Disponible gratuitement sur iOS et Android</p>';
        }
      }, 3000);
    })();
  </script>
</body>
</html>
